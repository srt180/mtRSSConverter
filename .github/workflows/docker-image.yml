name: Release hotfix

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  IMAGE: registry.cn-hangzhou.aliyuncs.com/srt180/mtrssconverter

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push architecture image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/${{ matrix.arch }}
          # This registry rejects OCI attestation manifests.
          provenance: false
          sbom: false
          outputs: type=image,oci-mediatypes=false
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish Docker manifest lists
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          for tag in "$VERSION" latest "$GITHUB_SHA"; do
            docker manifest create "$IMAGE:$tag" \
              "$IMAGE:$VERSION-amd64" "$IMAGE:$VERSION-arm64"
            docker manifest push "$IMAGE:$tag"
          done
          docker manifest inspect "$IMAGE:$VERSION"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --target "$GITHUB_SHA" --title "$GITHUB_REF_NAME — Download Station RSS 兼容性修复" --notes-file RELEASE_NOTES.md
